<svg xmlns="http://www.w3.org/2000/svg" width="960" height="605" viewBox="0 0 960 605" role="img" aria-labelledby="title desc">
<title id="title">DMDR: two gradients meet in one student</title>
<desc id="desc">A few-step student supplies video samples to two branches. VideoAlign feeds an NFT-style reward loss. A re-noised student sample is evaluated by a frozen teacher and a separately trained fake-score critic. Their clean reconstructions give the DMD correction. The student receives the weighted sum of the reward and distribution-matching losses, plus an optional reference anchor.</desc>
