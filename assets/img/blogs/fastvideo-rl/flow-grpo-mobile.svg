<svg xmlns="http://www.w3.org/2000/svg" width="400" height="641" viewBox="0 0 400 641" role="img" aria-labelledby="title desc">
<title id="title">Flow-GRPO: reward the stochastic decisions</title>
<desc id="desc">Candidates share a prompt and initial latent. A deterministic prefix enters a stochastic window with independent noise draws, then an ODE suffix completes each video. Group-normalized terminal rewards weight clipped transition-likelihood updates. Whole prompt groups are placed on one GPU.</desc>
