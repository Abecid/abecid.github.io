<text x="480" y="424" fill="#aab9cf" font-size="21" text-anchor="middle" font-weight="400">Same starting state, different local decisions; one candidate per GPU.</text>
<path d="M832 401 L832 447" fill="none" stroke="#aab9cf" stroke-width="2" marker-end="url(#aaab9cf)"/>
<rect x="40" y="457" width="880" height="94" rx="12" fill="#1b2940"/>
<text x="480" y="491" fill="#e8edf6" font-size="27" text-anchor="middle" font-weight="700">q*(a | s) ∝ p<tspan baseline-shift="sub" font-size="70%">old</tspan>(a | s) exp(R / τ)</text>
<text x="480" y="528" fill="#aab9cf" font-size="24" text-anchor="middle" font-weight="400">w = softmax(R / τ)    →    L = −Σ (wᵢ − 1/K) log p<tspan baseline-shift="sub" font-size="70%">θ</tspan>(aᵢ | s)</text>
