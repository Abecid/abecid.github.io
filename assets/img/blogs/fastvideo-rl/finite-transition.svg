<text x="40" y="78" fill="#aab9cf" font-size="21" text-anchor="start" font-weight="400">Finite-transition posterior projection · train the transition used at deployment</text>
<rect x="40" y="99" width="880" height="58" rx="12" fill="#1b2940"/>
