    <rect x="300" y="360" width="40" height="40" rx="1" fill="#89b4ff" stroke="#3e506a" stroke-width="1.5" />
    <rect x="340" y="360" width="40" height="40" rx="1" fill="#1c2a40" stroke="#3e506a" stroke-width="1.5" />
