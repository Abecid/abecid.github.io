<svg xmlns="http://www.w3.org/2000/svg" width="900" height="618" viewBox="0 0 900 618" role="img" aria-labelledby="title desc">
  <title id="title">Matrix tiles reuse each input four times</title>
  <desc id="desc">
    A 4 × 4 A tile and a 4 × 4 B tile contribute to a 4 × 4 C tile. One highlighted A element contributes to four columns of its
    C row; one highlighted B element contributes to four rows of its C column. Both inputs contribute at the intersection. Loading the two FP32 input
    tiles once transfers 128 bytes and enables 64 multiplication and addition pairs, counted as 128 FLOPs. Output C traffic is excluded.
  </desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="context-stroke" />
    </marker>
  </defs>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="0" y="0" width="900" height="618" rx="14" fill="#131d2e" stroke="none" stroke-width="1.5" />
    <text x="32" y="44" fill="#edf3fc" font-size="28" text-anchor="start" font-weight="600">Load once; reuse on chip</text>
    <text x="32" y="75" fill="#b5c4d9" font-size="21" text-anchor="start" font-weight="400">4 × 4 tiles · FP32</text>
    <text x="220" y="180" fill="#edf3fc" font-size="30" text-anchor="start" font-weight="600">C += A × B</text>
    <text x="220" y="211" fill="#b5c4d9" font-size="21" text-anchor="start" font-weight="400">one K tile</text>
