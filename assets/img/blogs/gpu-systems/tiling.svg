    <text x="670" y="508" fill="#edf3fc" font-size="24" text-anchor="middle" font-weight="600">C tile</text>
    <line x1="388" y1="380" x2="578" y2="380" stroke="#89b4ff" stroke-width="2.5" marker-end="url(#arrow)" />
    <text x="485" y="361" fill="#89b4ff" font-size="23" text-anchor="middle" font-weight="600">reuse 4×</text>
