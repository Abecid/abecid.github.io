<svg xmlns="http://www.w3.org/2000/svg" width="900" height="414" viewBox="0 0 900 414" role="img" aria-labelledby="title desc">
  <title id="title">Overlap hides communication time</title>
  <desc id="desc">
    Illustrative schedule: eight milliseconds compute and six milliseconds collective communication take fourteen milliseconds serialized. Starting
    communication at four milliseconds overlaps four milliseconds and finishes at ten milliseconds.
  </desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="context-stroke" />
    </marker>
  </defs>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="0" y="0" width="900" height="414" rx="14" fill="#131d2e" stroke="none" stroke-width="1.5" />
    <text x="32" y="44" fill="#edf3fc" font-size="28" text-anchor="start" font-weight="600">14 ms → 10 ms</text>
    <text x="32" y="75" fill="#b5c4d9" font-size="21" text-anchor="start" font-weight="400">4 ms of communication hidden</text>
    <text x="32" y="112" fill="#edf3fc" font-size="24" text-anchor="start" font-weight="600">Serialized</text>
    <text x="172" y="156" fill="#b5c4d9" font-size="23" text-anchor="end" font-weight="400">Compute</text>
    <rect x="182" y="132" width="385.143" height="34" rx="3" fill="#89b4ff" stroke="none" stroke-width="1.5" />
    <text x="374.571" y="156" fill="#131d2e" font-size="24" text-anchor="middle" font-weight="600">8 ms</text>
    <text x="172" y="200" fill="#b5c4d9" font-size="23" text-anchor="end" font-weight="400">Comm.</text>
    <rect x="567.143" y="176" width="288.857" height="34" rx="3" fill="#ffbd7a" stroke="none" stroke-width="1.5" />
    <text x="711.571" y="200" fill="#131d2e" font-size="24" text-anchor="middle" font-weight="600">6 ms</text>
    <line x1="856" y1="127" x2="856" y2="215" stroke="#65dfc0" stroke-width="1.5" stroke-dasharray="4 4" />
    <text x="32" y="247" fill="#edf3fc" font-size="24" text-anchor="start" font-weight="600">Overlapped</text>
    <text x="172" y="291" fill="#b5c4d9" font-size="23" text-anchor="end" font-weight="400">Compute</text>
    <rect x="182" y="267" width="385.143" height="34" rx="3" fill="#89b4ff" stroke="none" stroke-width="1.5" />
    <text x="374.571" y="291" fill="#131d2e" font-size="24" text-anchor="middle" font-weight="600">8 ms</text>
    <text x="172" y="335" fill="#b5c4d9" font-size="23" text-anchor="end" font-weight="400">Comm.</text>
    <rect x="374.571" y="311" width="288.857" height="34" rx="3" fill="#ffbd7a" stroke="none" stroke-width="1.5" />
    <text x="519" y="335" fill="#131d2e" font-size="24" text-anchor="middle" font-weight="600">6 ms</text>
    <line x1="663.429" y1="262" x2="663.429" y2="350" stroke="#65dfc0" stroke-width="1.5" stroke-dasharray="4 4" />
    <line x1="182" y1="365" x2="856" y2="365" stroke="#b5c4d9" stroke-width="1.5" />
    <line x1="182" y1="365" x2="182" y2="370" stroke="#b5c4d9" stroke-width="1.5" />
    <text x="182" y="392" fill="#b5c4d9" font-size="21" text-anchor="middle" font-weight="400">0</text>
    <line x1="374.571" y1="365" x2="374.571" y2="370" stroke="#b5c4d9" stroke-width="1.5" />
    <text x="374.571" y="392" fill="#b5c4d9" font-size="21" text-anchor="middle" font-weight="400">4</text>
    <line x1="567.143" y1="365" x2="567.143" y2="370" stroke="#b5c4d9" stroke-width="1.5" />
    <text x="567.143" y="392" fill="#b5c4d9" font-size="21" text-anchor="middle" font-weight="400">8</text>
    <line x1="663.429" y1="365" x2="663.429" y2="370" stroke="#b5c4d9" stroke-width="1.5" />
    <text x="663.429" y="392" fill="#b5c4d9" font-size="21" text-anchor="middle" font-weight="400">10</text>
    <line x1="856" y1="365" x2="856" y2="370" stroke="#b5c4d9" stroke-width="1.5" />
    <text x="856" y="392" fill="#b5c4d9" font-size="21" text-anchor="middle" font-weight="400">14</text>
    <text x="32" y="392" fill="#b5c4d9" font-size="21" text-anchor="start" font-weight="400">Time (ms)</text>
  </g>
</svg>
