<svg xmlns="http://www.w3.org/2000/svg" width="390" height="411" viewBox="0 0 390 411" role="img" aria-labelledby="title desc">
  <title id="title">Fewer denoising steps expose fixed work</title>
  <desc id="desc">
    Illustrative latency is 40 milliseconds per denoising step plus 200 milliseconds fixed. Twenty steps take 1000 milliseconds, four take 360, and
    one takes 240.
  </desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="context-stroke" />
    </marker>
  </defs>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="0" y="0" width="390" height="411" rx="14" fill="#131d2e" stroke="none" stroke-width="1.5" />
    <text x="22" y="36" fill="#edf3fc" font-size="21" text-anchor="start" font-weight="600">40K + 200 ms</text>
    <text x="22" y="63" fill="#b5c4d9" font-size="17" text-anchor="start" font-weight="400">K denoising steps + fixed work</text>
    <text x="22" y="105" fill="#edf3fc" font-size="18" text-anchor="start" font-weight="400">K = 20</text>
    <rect x="22" y="117" width="210.4" height="32" rx="0" fill="#89b4ff" stroke="none" stroke-width="1.5" />
    <rect x="232.4" y="117" width="52.6" height="32" rx="0" fill="#ffbd7a" stroke="none" stroke-width="1.5" />
    <text x="296" y="140" fill="#edf3fc" font-size="18" text-anchor="start" font-weight="600">1,000</text>
    <text x="22" y="199" fill="#edf3fc" font-size="18" text-anchor="start" font-weight="400">K = 4</text>
    <rect x="22" y="211" width="42.08" height="32" rx="0" fill="#89b4ff" stroke="none" stroke-width="1.5" />
    <rect x="64.08" y="211" width="52.6" height="32" rx="0" fill="#ffbd7a" stroke="none" stroke-width="1.5" />
    <text x="127.68" y="234" fill="#edf3fc" font-size="18" text-anchor="start" font-weight="600">360</text>
    <text x="22" y="293" fill="#edf3fc" font-size="18" text-anchor="start" font-weight="400">K = 1</text>
    <rect x="22" y="305" width="10.52" height="32" rx="0" fill="#89b4ff" stroke="none" stroke-width="1.5" />
    <rect x="32.52" y="305" width="52.6" height="32" rx="0" fill="#ffbd7a" stroke="none" stroke-width="1.5" />
    <text x="96.12" y="328" fill="#edf3fc" font-size="18" text-anchor="start" font-weight="600">240</text>
    <rect x="22" y="371" width="13" height="13" rx="0" fill="#89b4ff" stroke="none" stroke-width="1.5" />
    <text x="43" y="384" fill="#b5c4d9" font-size="17" text-anchor="start" font-weight="400">Denoiser</text>
    <rect x="179" y="371" width="13" height="13" rx="0" fill="#ffbd7a" stroke="none" stroke-width="1.5" />
    <text x="200" y="384" fill="#b5c4d9" font-size="17" text-anchor="start" font-weight="400">Fixed</text>
    <text x="368" y="384" fill="#b5c4d9" font-size="17" text-anchor="end" font-weight="400">ms</text>
  </g>
</svg>
