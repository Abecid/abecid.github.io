<svg xmlns="http://www.w3.org/2000/svg" width="900" height="344" viewBox="0 0 900 344" role="img" aria-labelledby="title desc">
  <title id="title">A small kernel has a small ceiling</title>
  <desc id="desc">
    Illustrative 100 ms workload: 95 ms other work and 5 ms target kernel. A kernel running three times faster gives 96.67 ms total; removing it entirely
    gives 95 ms.
  </desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="context-stroke" />
    </marker>
  </defs>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="0" y="0" width="900" height="344" rx="14" fill="#131d2e" stroke="none" stroke-width="1.5" />
    <text x="32" y="44" fill="#edf3fc" font-size="28" text-anchor="start" font-weight="600">Only 5 ms can shrink</text>
    <text x="32" y="136" fill="#edf3fc" font-size="24" text-anchor="start" font-weight="400">Original</text>
    <rect x="204" y="111" width="543.4" height="36" rx="0" fill="#89b4ff" stroke="none" stroke-width="1.5" />
    <rect x="747.4" y="111" width="28.6" height="36" rx="0" fill="#ffbd7a" stroke="none" stroke-width="1.5" />
    <text x="786" y="136" fill="#edf3fc" font-size="24" text-anchor="start" font-weight="600">100</text>
    <text x="475.7" y="136" fill="#131d2e" font-size="24" text-anchor="middle" font-weight="600">95 ms</text>
    <text x="32" y="213" fill="#edf3fc" font-size="24" text-anchor="start" font-weight="400">3× kernel</text>
    <rect x="204" y="188" width="543.4" height="36" rx="0" fill="#89b4ff" stroke="none" stroke-width="1.5" />
    <rect x="747.4" y="188" width="9.53333" height="36" rx="0" fill="#ffbd7a" stroke="none" stroke-width="1.5" />
    <text x="786" y="213" fill="#edf3fc" font-size="24" text-anchor="start" font-weight="600">96.67</text>
    <text x="32" y="290" fill="#edf3fc" font-size="24" text-anchor="start" font-weight="400">∞× kernel</text>
    <rect x="204" y="265" width="543.4" height="36" rx="0" fill="#89b4ff" stroke="none" stroke-width="1.5" />
    <text x="786" y="290" fill="#edf3fc" font-size="24" text-anchor="start" font-weight="600">95</text>
    <rect x="32" y="56" width="13" height="13" rx="0" fill="#89b4ff" stroke="none" stroke-width="1.5" />
    <text x="53" y="69" fill="#b5c4d9" font-size="21" text-anchor="start" font-weight="400">Other work</text>
    <rect x="221" y="56" width="13" height="13" rx="0" fill="#ffbd7a" stroke="none" stroke-width="1.5" />
    <text x="242" y="69" fill="#b5c4d9" font-size="21" text-anchor="start" font-weight="400">Target</text>
    <text x="878" y="326" fill="#b5c4d9" font-size="21" text-anchor="end" font-weight="400">Total: ms</text>
  </g>
</svg>
