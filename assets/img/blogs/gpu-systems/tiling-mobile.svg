    <text x="22" y="36" fill="#edf3fc" font-size="21" text-anchor="start" font-weight="600">Load once; reuse on chip</text>
    <text x="22" y="63" fill="#b5c4d9" font-size="17" text-anchor="start" font-weight="400">4 × 4 tiles · FP32</text>
    <text x="22" y="157" fill="#edf3fc" font-size="23" text-anchor="start" font-weight="600">C += A × B</text>
    <text x="22" y="184" fill="#b5c4d9" font-size="17" text-anchor="start" font-weight="400">one K tile</text>
