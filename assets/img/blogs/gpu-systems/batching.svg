<svg xmlns="http://www.w3.org/2000/svg" width="900" height="414" viewBox="0 0 900 414" role="img" aria-labelledby="title desc">
  <title id="title">Refill a batch slot when a request finishes</title>
  <desc id="desc">
    Illustrative schedule with two slots with A taking four iterations, B two, and C two. Static batching starts C after A finishes and ends at iteration
    six. Continuous batching replaces B with C at iteration two and ends at iteration four.
  </desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="context-stroke" />
    </marker>
  </defs>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="0" y="0" width="900" height="414" rx="14" fill="#131d2e" stroke="none" stroke-width="1.5" />
    <text x="32" y="44" fill="#edf3fc" font-size="28" text-anchor="start" font-weight="600">Refill an empty slot</text>
    <text x="32" y="75" fill="#b5c4d9" font-size="21" text-anchor="start" font-weight="400">A: 4 iterations · B: 2 · C: 2</text>
    <text x="32" y="112" fill="#edf3fc" font-size="24" text-anchor="start" font-weight="600">Static</text>
    <text x="157" y="156" fill="#b5c4d9" font-size="23" text-anchor="end" font-weight="400">Slot 1</text>
    <rect x="167" y="132" width="689" height="34" rx="3" fill="#1c2a40" stroke="#3e506a" stroke-width="1.5" />
    <text x="157" y="200" fill="#b5c4d9" font-size="23" text-anchor="end" font-weight="400">Slot 2</text>
    <rect x="167" y="176" width="689" height="34" rx="3" fill="#1c2a40" stroke="#3e506a" stroke-width="1.5" />
    <rect x="168" y="132" width="457.333" height="34" rx="3" fill="#89b4ff" stroke="none" stroke-width="1.5" />
    <text x="396.667" y="156" fill="#131d2e" font-size="24" text-anchor="middle" font-weight="600">A</text>
    <rect x="168" y="176" width="227.667" height="34" rx="3" fill="#ffbd7a" stroke="none" stroke-width="1.5" />
    <text x="281.833" y="200" fill="#131d2e" font-size="24" text-anchor="middle" font-weight="600">B</text>
    <rect x="627.333" y="132" width="227.667" height="34" rx="3" fill="#65dfc0" stroke="none" stroke-width="1.5" />
    <text x="741.167" y="156" fill="#131d2e" font-size="24" text-anchor="middle" font-weight="600">C</text>
    <line x1="856" y1="127" x2="856" y2="215" stroke="#65dfc0" stroke-width="1.5" stroke-dasharray="4 4" />
    <text x="32" y="247" fill="#edf3fc" font-size="24" text-anchor="start" font-weight="600">Continuous</text>
    <text x="157" y="291" fill="#b5c4d9" font-size="23" text-anchor="end" font-weight="400">Slot 1</text>
    <rect x="167" y="267" width="459.333" height="34" rx="3" fill="#1c2a40" stroke="#3e506a" stroke-width="1.5" />
    <text x="157" y="335" fill="#b5c4d9" font-size="23" text-anchor="end" font-weight="400">Slot 2</text>
    <rect x="167" y="311" width="459.333" height="34" rx="3" fill="#1c2a40" stroke="#3e506a" stroke-width="1.5" />
    <rect x="168" y="267" width="457.333" height="34" rx="3" fill="#89b4ff" stroke="none" stroke-width="1.5" />
    <text x="396.667" y="291" fill="#131d2e" font-size="24" text-anchor="middle" font-weight="600">A</text>
    <rect x="168" y="311" width="227.667" height="34" rx="3" fill="#ffbd7a" stroke="none" stroke-width="1.5" />
    <text x="281.833" y="335" fill="#131d2e" font-size="24" text-anchor="middle" font-weight="600">B</text>
    <rect x="397.667" y="311" width="227.667" height="34" rx="3" fill="#65dfc0" stroke="none" stroke-width="1.5" />
    <text x="511.5" y="335" fill="#131d2e" font-size="24" text-anchor="middle" font-weight="600">C</text>
    <line x1="626.333" y1="262" x2="626.333" y2="350" stroke="#65dfc0" stroke-width="1.5" stroke-dasharray="4 4" />
    <line x1="167" y1="365" x2="856" y2="365" stroke="#b5c4d9" stroke-width="1.5" />
    <line x1="167" y1="365" x2="167" y2="370" stroke="#b5c4d9" stroke-width="1.5" />
    <text x="167" y="392" fill="#b5c4d9" font-size="21" text-anchor="middle" font-weight="400">0</text>
    <line x1="396.667" y1="365" x2="396.667" y2="370" stroke="#b5c4d9" stroke-width="1.5" />
    <text x="396.667" y="392" fill="#b5c4d9" font-size="21" text-anchor="middle" font-weight="400">2</text>
    <line x1="626.333" y1="365" x2="626.333" y2="370" stroke="#b5c4d9" stroke-width="1.5" />
    <text x="626.333" y="392" fill="#b5c4d9" font-size="21" text-anchor="middle" font-weight="400">4</text>
    <line x1="856" y1="365" x2="856" y2="370" stroke="#b5c4d9" stroke-width="1.5" />
    <text x="856" y="392" fill="#b5c4d9" font-size="21" text-anchor="middle" font-weight="400">6</text>
    <text x="32" y="392" fill="#b5c4d9" font-size="21" text-anchor="start" font-weight="400">Iteration</text>
  </g>
</svg>
