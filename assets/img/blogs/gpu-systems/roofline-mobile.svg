<svg xmlns="http://www.w3.org/2000/svg" width="390" height="439" viewBox="0 0 390 439" role="img" aria-labelledby="title desc">
  <title id="title">Bandwidth and compute set the roofline</title>
  <desc id="desc">
    Hypothetical GPU: 2 TB/s memory bandwidth and 120 TFLOP/s compute. The roofline is min(2 times arithmetic intensity, 120) TFLOP/s; the ridge is 60
    FLOP per byte. Both axes use logarithmic scales.
  </desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="context-stroke" />
    </marker>
  </defs>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="0" y="0" width="390" height="439" rx="14" fill="#131d2e" stroke="none" stroke-width="1.5" />
    <text x="22" y="36" fill="#edf3fc" font-size="21" text-anchor="start" font-weight="600">Bandwidth → compute</text>
    <text x="22" y="63" fill="#b5c4d9" font-size="17" text-anchor="start" font-weight="400">Example: 2 TB/s · 120 TFLOP/s</text>
    <line x1="59" y1="354" x2="361" y2="354" stroke="#3e506a" stroke-width="1" />
    <text x="49" y="360" fill="#b5c4d9" font-size="17" text-anchor="end" font-weight="400">0.1</text>
    <line x1="59" y1="280.387" x2="361" y2="280.387" stroke="#3e506a" stroke-width="1" />
    <text x="49" y="286.387" fill="#b5c4d9" font-size="17" text-anchor="end" font-weight="400">1</text>
    <line x1="59" y1="206.773" x2="361" y2="206.773" stroke="#3e506a" stroke-width="1" />
    <text x="49" y="212.773" fill="#b5c4d9" font-size="17" text-anchor="end" font-weight="400">10</text>
    <line x1="59" y1="127.331" x2="361" y2="127.331" stroke="#3e506a" stroke-width="1" />
    <text x="49" y="133.331" fill="#b5c4d9" font-size="17" text-anchor="end" font-weight="400">120</text>
    <line x1="59" y1="354" x2="59" y2="360" stroke="#b5c4d9" stroke-width="1.5" />
    <text x="59" y="382" fill="#b5c4d9" font-size="17" text-anchor="middle" font-weight="400">0.1</text>
    <line x1="134.5" y1="354" x2="134.5" y2="360" stroke="#b5c4d9" stroke-width="1.5" />
    <text x="134.5" y="382" fill="#b5c4d9" font-size="17" text-anchor="middle" font-weight="400">1</text>
    <line x1="210" y1="354" x2="210" y2="360" stroke="#b5c4d9" stroke-width="1.5" />
    <text x="210" y="382" fill="#b5c4d9" font-size="17" text-anchor="middle" font-weight="400">10</text>
    <line x1="361" y1="354" x2="361" y2="360" stroke="#b5c4d9" stroke-width="1.5" />
    <text x="361" y="382" fill="#b5c4d9" font-size="17" text-anchor="middle" font-weight="400">1000</text>
    <line x1="59" y1="354" x2="361" y2="354" stroke="#b5c4d9" stroke-width="1.5" />
    <line x1="59" y1="354" x2="59" y2="111" stroke="#b5c4d9" stroke-width="1.5" />
    <line x1="268.75" y1="127.331" x2="268.75" y2="354" stroke="#b5c4d9" stroke-width="1.5" stroke-dasharray="4 5" />
    <path d="M 59 331.84 L 268.75 127.331 L 361 127.331" fill="none" stroke="#65dfc0" stroke-width="4" />
    <circle cx="268.75" cy="127.331" r="5" fill="#65dfc0" />
    <text x="268.75" y="382" fill="#65dfc0" font-size="17" text-anchor="middle" font-weight="400">60</text>
    <text x="59" y="97" fill="#b5c4d9" font-size="17" text-anchor="start" font-weight="400">TFLOP/s</text>
    <text x="104.456" y="236.067" fill="#65dfc0" font-size="18" text-anchor="start" font-weight="600">2 TB/s</text>
    <text x="358" y="112.331" fill="#65dfc0" font-size="18" text-anchor="end" font-weight="600">120</text>
    <text x="210" y="420" fill="#b5c4d9" font-size="17" text-anchor="middle" font-weight="400">FLOP / byte · log scales</text>
  </g>
</svg>
