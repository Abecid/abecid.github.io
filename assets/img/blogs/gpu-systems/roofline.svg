<svg xmlns="http://www.w3.org/2000/svg" width="900" height="451" viewBox="0 0 900 451" role="img" aria-labelledby="title desc">
  <title id="title">Bandwidth and compute set the roofline</title>
  <desc id="desc">
    Hypothetical GPU: 2 TB/s memory bandwidth and 120 TFLOP/s compute. The roofline is min(2 times arithmetic intensity, 120) TFLOP/s; the ridge is 60
    FLOP per byte. Both axes use logarithmic scales.
  </desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="context-stroke" />
    </marker>
  </defs>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="0" y="0" width="900" height="451" rx="14" fill="#131d2e" stroke="none" stroke-width="1.5" />
    <text x="32" y="44" fill="#edf3fc" font-size="28" text-anchor="start" font-weight="600">Bandwidth → compute</text>
    <text x="32" y="75" fill="#b5c4d9" font-size="21" text-anchor="start" font-weight="400">Example: 2 TB/s · 120 TFLOP/s</text>
    <line x1="95" y1="358" x2="851" y2="358" stroke="#3e506a" stroke-width="1" />
    <text x="85" y="364" fill="#b5c4d9" font-size="21" text-anchor="end" font-weight="400">0.1</text>
    <line x1="95" y1="284.084" x2="851" y2="284.084" stroke="#3e506a" stroke-width="1" />
    <text x="85" y="290.084" fill="#b5c4d9" font-size="21" text-anchor="end" font-weight="400">1</text>
    <line x1="95" y1="210.167" x2="851" y2="210.167" stroke="#3e506a" stroke-width="1" />
    <text x="85" y="216.167" fill="#b5c4d9" font-size="21" text-anchor="end" font-weight="400">10</text>
    <line x1="95" y1="130.398" x2="851" y2="130.398" stroke="#3e506a" stroke-width="1" />
    <text x="85" y="136.398" fill="#b5c4d9" font-size="21" text-anchor="end" font-weight="400">120</text>
    <line x1="95" y1="358" x2="95" y2="364" stroke="#b5c4d9" stroke-width="1.5" />
    <text x="95" y="386" fill="#b5c4d9" font-size="21" text-anchor="middle" font-weight="400">0.1</text>
    <line x1="284" y1="358" x2="284" y2="364" stroke="#b5c4d9" stroke-width="1.5" />
    <text x="284" y="386" fill="#b5c4d9" font-size="21" text-anchor="middle" font-weight="400">1</text>
    <line x1="473" y1="358" x2="473" y2="364" stroke="#b5c4d9" stroke-width="1.5" />
    <text x="473" y="386" fill="#b5c4d9" font-size="21" text-anchor="middle" font-weight="400">10</text>
    <line x1="851" y1="358" x2="851" y2="364" stroke="#b5c4d9" stroke-width="1.5" />
    <text x="851" y="386" fill="#b5c4d9" font-size="21" text-anchor="middle" font-weight="400">1000</text>
    <line x1="95" y1="358" x2="851" y2="358" stroke="#b5c4d9" stroke-width="1.5" />
    <line x1="95" y1="358" x2="95" y2="114" stroke="#b5c4d9" stroke-width="1.5" />
    <line x1="620.071" y1="130.398" x2="620.071" y2="358" stroke="#b5c4d9" stroke-width="1.5" stroke-dasharray="4 5" />
    <path d="M 95 335.749 L 620.071 130.398 L 851 130.398" fill="none" stroke="#65dfc0" stroke-width="4" />
    <circle cx="620.071" cy="130.398" r="5" fill="#65dfc0" />
    <text x="620.071" y="386" fill="#65dfc0" font-size="21" text-anchor="middle" font-weight="400">60</text>
    <text x="95" y="100" fill="#b5c4d9" font-size="21" text-anchor="start" font-weight="400">TFLOP/s</text>
    <text x="208.789" y="239.582" fill="#65dfc0" font-size="24" text-anchor="start" font-weight="600">2 TB/s</text>
    <text x="848" y="115.398" fill="#65dfc0" font-size="24" text-anchor="end" font-weight="600">120</text>
    <text x="473" y="432" fill="#b5c4d9" font-size="21" text-anchor="middle" font-weight="400">FLOP / byte · log scales</text>
  </g>
</svg>
