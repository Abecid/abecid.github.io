<svg xmlns="http://www.w3.org/2000/svg" width="900" height="356" viewBox="0 0 900 356" role="img" aria-labelledby="title desc">
  <title id="title">Fewer denoising steps expose fixed work</title>
  <desc id="desc">
    Illustrative latency is 40 milliseconds per denoising step plus 200 milliseconds fixed. Twenty steps take 1000 milliseconds, four take 360, and
    one takes 240.
  </desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="context-stroke" />
    </marker>
  </defs>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="0" y="0" width="900" height="356" rx="14" fill="#131d2e" stroke="none" stroke-width="1.5" />
    <text x="32" y="44" fill="#edf3fc" font-size="28" text-anchor="start" font-weight="600">40K + 200 ms</text>
    <text x="32" y="75" fill="#b5c4d9" font-size="21" text-anchor="start" font-weight="400">K denoising steps + fixed work</text>
    <text x="32" y="137" fill="#edf3fc" font-size="24" text-anchor="start" font-weight="400">K = 20</text>
    <rect x="146" y="111" width="493.6" height="38" rx="0" fill="#89b4ff" stroke="none" stroke-width="1.5" />
    <rect x="639.6" y="111" width="123.4" height="38" rx="0" fill="#ffbd7a" stroke="none" stroke-width="1.5" />
    <text x="774" y="137" fill="#edf3fc" font-size="24" text-anchor="start" font-weight="600">1,000</text>
    <text x="32" y="211" fill="#edf3fc" font-size="24" text-anchor="start" font-weight="400">K = 4</text>
    <rect x="146" y="185" width="98.72" height="38" rx="0" fill="#89b4ff" stroke="none" stroke-width="1.5" />
    <rect x="244.72" y="185" width="123.4" height="38" rx="0" fill="#ffbd7a" stroke="none" stroke-width="1.5" />
    <text x="379.12" y="211" fill="#edf3fc" font-size="24" text-anchor="start" font-weight="600">360</text>
    <text x="32" y="285" fill="#edf3fc" font-size="24" text-anchor="start" font-weight="400">K = 1</text>
    <rect x="146" y="259" width="24.68" height="38" rx="0" fill="#89b4ff" stroke="none" stroke-width="1.5" />
    <rect x="170.68" y="259" width="123.4" height="38" rx="0" fill="#ffbd7a" stroke="none" stroke-width="1.5" />
    <text x="305.08" y="285" fill="#edf3fc" font-size="24" text-anchor="start" font-weight="600">240</text>
    <rect x="32" y="316" width="13" height="13" rx="0" fill="#89b4ff" stroke="none" stroke-width="1.5" />
    <text x="53" y="329" fill="#b5c4d9" font-size="21" text-anchor="start" font-weight="400">Denoiser</text>
    <rect x="242" y="316" width="13" height="13" rx="0" fill="#ffbd7a" stroke="none" stroke-width="1.5" />
    <text x="263" y="329" fill="#b5c4d9" font-size="21" text-anchor="start" font-weight="400">Fixed</text>
    <text x="878" y="329" fill="#b5c4d9" font-size="21" text-anchor="end" font-weight="400">ms</text>
  </g>
</svg>
