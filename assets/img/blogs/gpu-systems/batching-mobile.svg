<svg xmlns="http://www.w3.org/2000/svg" width="390" height="447" viewBox="0 0 390 447" role="img" aria-labelledby="title desc">
  <title id="title">Refill a batch slot when a request finishes</title>
  <desc id="desc">
    Illustrative two-slot schedule with A taking four iterations, B two, and C two. Static batching starts C after A finishes and ends at iteration
    six. Continuous batching replaces B with C at iteration two and ends at iteration four.
  </desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="context-stroke" />
    </marker>
  </defs>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="0" y="0" width="390" height="447" rx="14" fill="#131d2e" stroke="none" stroke-width="1.5" />
    <text x="22" y="36" fill="#edf3fc" font-size="21" text-anchor="start" font-weight="600">Refill an empty slot</text>
    <text x="22" y="63" fill="#b5c4d9" font-size="17" text-anchor="start" font-weight="400">A: 4 iterations · B: 2 · C: 2</text>
    <text x="22" y="112" fill="#edf3fc" font-size="18" text-anchor="start" font-weight="600">Static</text>
    <text x="82" y="156" fill="#b5c4d9" font-size="17" text-anchor="end" font-weight="400">Slot 1</text>
    <rect x="92" y="132" width="274" height="34" rx="3" fill="#1c2a40" stroke="#3e506a" stroke-width="1.5" />
    <text x="82" y="200" fill="#b5c4d9" font-size="17" text-anchor="end" font-weight="400">Slot 2</text>
    <rect x="92" y="176" width="274" height="34" rx="3" fill="#1c2a40" stroke="#3e506a" stroke-width="1.5" />
    <rect x="93" y="132" width="180.667" height="34" rx="3" fill="#89b4ff" stroke="none" stroke-width="1.5" />
    <text x="183.333" y="156" fill="#131d2e" font-size="18" text-anchor="middle" font-weight="600">A</text>
    <rect x="93" y="176" width="89.3333" height="34" rx="3" fill="#ffbd7a" stroke="none" stroke-width="1.5" />
    <text x="137.667" y="200" fill="#131d2e" font-size="18" text-anchor="middle" font-weight="600">B</text>
    <rect x="275.667" y="132" width="89.3333" height="34" rx="3" fill="#65dfc0" stroke="none" stroke-width="1.5" />
    <text x="320.333" y="156" fill="#131d2e" font-size="18" text-anchor="middle" font-weight="600">C</text>
    <line x1="366" y1="127" x2="366" y2="215" stroke="#65dfc0" stroke-width="1.5" stroke-dasharray="4 4" />
    <text x="22" y="257" fill="#edf3fc" font-size="18" text-anchor="start" font-weight="600">Continuous</text>
    <text x="82" y="301" fill="#b5c4d9" font-size="17" text-anchor="end" font-weight="400">Slot 1</text>
    <rect x="92" y="277" width="182.667" height="34" rx="3" fill="#1c2a40" stroke="#3e506a" stroke-width="1.5" />
    <text x="82" y="345" fill="#b5c4d9" font-size="17" text-anchor="end" font-weight="400">Slot 2</text>
    <rect x="92" y="321" width="182.667" height="34" rx="3" fill="#1c2a40" stroke="#3e506a" stroke-width="1.5" />
    <rect x="93" y="277" width="180.667" height="34" rx="3" fill="#89b4ff" stroke="none" stroke-width="1.5" />
    <text x="183.333" y="301" fill="#131d2e" font-size="18" text-anchor="middle" font-weight="600">A</text>
    <rect x="93" y="321" width="89.3333" height="34" rx="3" fill="#ffbd7a" stroke="none" stroke-width="1.5" />
    <text x="137.667" y="345" fill="#131d2e" font-size="18" text-anchor="middle" font-weight="600">B</text>
    <rect x="184.333" y="321" width="89.3333" height="34" rx="3" fill="#65dfc0" stroke="none" stroke-width="1.5" />
    <text x="229" y="345" fill="#131d2e" font-size="18" text-anchor="middle" font-weight="600">C</text>
    <line x1="274.667" y1="272" x2="274.667" y2="360" stroke="#65dfc0" stroke-width="1.5" stroke-dasharray="4 4" />
    <line x1="92" y1="398" x2="366" y2="398" stroke="#b5c4d9" stroke-width="1.5" />
    <line x1="92" y1="398" x2="92" y2="403" stroke="#b5c4d9" stroke-width="1.5" />
    <text x="92" y="425" fill="#b5c4d9" font-size="17" text-anchor="middle" font-weight="400">0</text>
    <line x1="183.333" y1="398" x2="183.333" y2="403" stroke="#b5c4d9" stroke-width="1.5" />
    <text x="183.333" y="425" fill="#b5c4d9" font-size="17" text-anchor="middle" font-weight="400">2</text>
    <line x1="274.667" y1="398" x2="274.667" y2="403" stroke="#b5c4d9" stroke-width="1.5" />
    <text x="274.667" y="425" fill="#b5c4d9" font-size="17" text-anchor="middle" font-weight="400">4</text>
    <line x1="366" y1="398" x2="366" y2="403" stroke="#b5c4d9" stroke-width="1.5" />
    <text x="366" y="425" fill="#b5c4d9" font-size="17" text-anchor="middle" font-weight="400">6</text>
    <text x="14" y="425" fill="#b5c4d9" font-size="17" text-anchor="start" font-weight="400">Iteration</text>
  </g>
</svg>
