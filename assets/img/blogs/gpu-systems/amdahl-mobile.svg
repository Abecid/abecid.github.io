<svg xmlns="http://www.w3.org/2000/svg" width="390" height="399" viewBox="0 0 390 399" role="img" aria-labelledby="title desc">
  <title id="title">A small kernel has a small ceiling</title>
  <desc id="desc">
    Illustrative 100 ms workload: 95 ms other work and 5 ms target kernel. A kernel running three times faster gives 96.67 ms total; removing it entirely
    gives 95 ms.
  </desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="context-stroke" />
    </marker>
  </defs>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="0" y="0" width="390" height="399" rx="14" fill="#131d2e" stroke="none" stroke-width="1.5" />
    <text x="22" y="36" fill="#edf3fc" font-size="21" text-anchor="start" font-weight="600">Only 5 ms can shrink</text>
    <text x="22" y="102" fill="#edf3fc" font-size="18" text-anchor="start" font-weight="400">Original</text>
    <rect x="22" y="114" width="251.75" height="30" rx="0" fill="#89b4ff" stroke="none" stroke-width="1.5" />
    <rect x="273.75" y="114" width="13.25" height="30" rx="0" fill="#ffbd7a" stroke="none" stroke-width="1.5" />
    <text x="297" y="136" fill="#edf3fc" font-size="18" text-anchor="start" font-weight="600">100</text>
    <text x="147.875" y="136" fill="#131d2e" font-size="18" text-anchor="middle" font-weight="600">95 ms</text>
    <text x="22" y="197" fill="#edf3fc" font-size="18" text-anchor="start" font-weight="400">3× kernel</text>
    <rect x="22" y="209" width="251.75" height="30" rx="0" fill="#89b4ff" stroke="none" stroke-width="1.5" />
    <rect x="273.75" y="209" width="4.41667" height="30" rx="0" fill="#ffbd7a" stroke="none" stroke-width="1.5" />
    <text x="297" y="231" fill="#edf3fc" font-size="18" text-anchor="start" font-weight="600">96.67</text>
    <text x="22" y="292" fill="#edf3fc" font-size="18" text-anchor="start" font-weight="400">∞× kernel</text>
    <rect x="22" y="304" width="251.75" height="30" rx="0" fill="#89b4ff" stroke="none" stroke-width="1.5" />
    <text x="297" y="326" fill="#edf3fc" font-size="18" text-anchor="start" font-weight="600">95</text>
    <rect x="22" y="52" width="13" height="13" rx="0" fill="#89b4ff" stroke="none" stroke-width="1.5" />
    <text x="43" y="65" fill="#b5c4d9" font-size="17" text-anchor="start" font-weight="400">Other work</text>
    <rect x="179" y="52" width="13" height="13" rx="0" fill="#ffbd7a" stroke="none" stroke-width="1.5" />
    <text x="200" y="65" fill="#b5c4d9" font-size="17" text-anchor="start" font-weight="400">Target</text>
    <text x="368" y="381" fill="#b5c4d9" font-size="17" text-anchor="end" font-weight="400">Total: ms</text>
  </g>
</svg>
