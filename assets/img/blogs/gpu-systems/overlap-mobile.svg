<svg xmlns="http://www.w3.org/2000/svg" width="390" height="447" viewBox="0 0 390 447" role="img" aria-labelledby="title desc">
  <title id="title">Overlap hides communication time</title>
  <desc id="desc">
    Illustrative schedule: eight milliseconds compute and six milliseconds collective communication take fourteen milliseconds serialized. Starting
    communication at four milliseconds overlaps four milliseconds and finishes at ten milliseconds.
  </desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="context-stroke" />
    </marker>
  </defs>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="0" y="0" width="390" height="447" rx="14" fill="#131d2e" stroke="none" stroke-width="1.5" />
    <text x="22" y="36" fill="#edf3fc" font-size="21" text-anchor="start" font-weight="600">14 ms → 10 ms</text>
    <text x="22" y="63" fill="#b5c4d9" font-size="17" text-anchor="start" font-weight="400">4 ms of communication hidden</text>
    <text x="22" y="112" fill="#edf3fc" font-size="18" text-anchor="start" font-weight="600">Serialized</text>
    <text x="91" y="156" fill="#b5c4d9" font-size="17" text-anchor="end" font-weight="400">Compute</text>
    <rect x="101" y="132" width="151.429" height="34" rx="3" fill="#89b4ff" stroke="none" stroke-width="1.5" />
    <text x="176.714" y="156" fill="#131d2e" font-size="18" text-anchor="middle" font-weight="600">8 ms</text>
    <text x="91" y="200" fill="#b5c4d9" font-size="17" text-anchor="end" font-weight="400">Comm.</text>
    <rect x="252.429" y="176" width="113.571" height="34" rx="3" fill="#ffbd7a" stroke="none" stroke-width="1.5" />
    <text x="309.214" y="200" fill="#131d2e" font-size="18" text-anchor="middle" font-weight="600">6 ms</text>
    <line x1="366" y1="127" x2="366" y2="215" stroke="#65dfc0" stroke-width="1.5" stroke-dasharray="4 4" />
    <text x="22" y="257" fill="#edf3fc" font-size="18" text-anchor="start" font-weight="600">Overlapped</text>
    <text x="91" y="301" fill="#b5c4d9" font-size="17" text-anchor="end" font-weight="400">Compute</text>
    <rect x="101" y="277" width="151.429" height="34" rx="3" fill="#89b4ff" stroke="none" stroke-width="1.5" />
    <text x="176.714" y="301" fill="#131d2e" font-size="18" text-anchor="middle" font-weight="600">8 ms</text>
    <text x="91" y="345" fill="#b5c4d9" font-size="17" text-anchor="end" font-weight="400">Comm.</text>
    <rect x="176.714" y="321" width="113.571" height="34" rx="3" fill="#ffbd7a" stroke="none" stroke-width="1.5" />
    <text x="233.5" y="345" fill="#131d2e" font-size="18" text-anchor="middle" font-weight="600">6 ms</text>
    <line x1="290.286" y1="272" x2="290.286" y2="360" stroke="#65dfc0" stroke-width="1.5" stroke-dasharray="4 4" />
    <line x1="101" y1="398" x2="366" y2="398" stroke="#b5c4d9" stroke-width="1.5" />
    <line x1="101" y1="398" x2="101" y2="403" stroke="#b5c4d9" stroke-width="1.5" />
    <text x="101" y="425" fill="#b5c4d9" font-size="17" text-anchor="middle" font-weight="400">0</text>
    <line x1="176.714" y1="398" x2="176.714" y2="403" stroke="#b5c4d9" stroke-width="1.5" />
    <text x="176.714" y="425" fill="#b5c4d9" font-size="17" text-anchor="middle" font-weight="400">4</text>
    <line x1="252.429" y1="398" x2="252.429" y2="403" stroke="#b5c4d9" stroke-width="1.5" />
    <text x="252.429" y="425" fill="#b5c4d9" font-size="17" text-anchor="middle" font-weight="400">8</text>
    <line x1="290.286" y1="398" x2="290.286" y2="403" stroke="#b5c4d9" stroke-width="1.5" />
    <text x="290.286" y="425" fill="#b5c4d9" font-size="17" text-anchor="middle" font-weight="400">10</text>
    <line x1="366" y1="398" x2="366" y2="403" stroke="#b5c4d9" stroke-width="1.5" />
    <text x="366" y="425" fill="#b5c4d9" font-size="17" text-anchor="middle" font-weight="400">14</text>
    <text x="22" y="425" fill="#b5c4d9" font-size="17" text-anchor="start" font-weight="400">ms</text>
  </g>
</svg>
