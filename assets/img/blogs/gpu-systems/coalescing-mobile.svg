<svg xmlns="http://www.w3.org/2000/svg" width="390" height="538" viewBox="0 0 390 538" role="img" aria-labelledby="title desc">
  <title id="title">Contiguous lanes use fewer memory sectors</title>
  <desc id="desc">
    For 32 aligned FP32 loads, contiguous lanes use four 32-byte sectors: 128 bytes. Stride-eight loads use 32 sectors: 1024 bytes. Each load requests
    the same 128 useful bytes.
  </desc>
