<svg xmlns="http://www.w3.org/2000/svg" width="900" height="476" viewBox="0 0 900 476" role="img" aria-labelledby="title desc">
  <title id="title">Fusion keeps intermediates on chip</title>
  <desc id="desc">
    Three elementwise kernels perform multiply, add, and activation with two intermediate arrays in global memory. One fused kernel keeps those
    intermediates on chip, reducing ideal array traffic from 24N to 8N bytes for FP32.
  </desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="context-stroke" />
    </marker>
  </defs>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="0" y="0" width="900" height="476" rx="14" fill="#131d2e" stroke="none" stroke-width="1.5" />
    <text x="32" y="44" fill="#edf3fc" font-size="28" text-anchor="start" font-weight="600">Keep intermediates on chip</text>
    <text x="32" y="89" fill="#edf3fc" font-size="24" text-anchor="start" font-weight="600">3 kernels</text>
    <text x="868" y="89" fill="#ffbd7a" font-size="24" text-anchor="end" font-weight="600">24N B</text>
    <rect x="53" y="192" width="794" height="36" rx="4" fill="#1c2a40" stroke="none" stroke-width="1.5" />
    <rect x="169.333" y="120" width="48" height="44" rx="6" fill="#131d2e" stroke="#89b4ff" stroke-width="1.5" />
    <text x="193.333" y="149" fill="#edf3fc" font-size="24" text-anchor="middle" font-weight="600">×a</text>
    <line x1="65" y1="190" x2="177.333" y2="167" stroke="#89b4ff" stroke-width="2.5" marker-end="url(#arrow)" />
    <line x1="209.333" y1="167" x2="321.667" y2="190" stroke="#ffbd7a" stroke-width="2.5" marker-end="url(#arrow)" />
    <rect x="426" y="120" width="48" height="44" rx="6" fill="#131d2e" stroke="#89b4ff" stroke-width="1.5" />
    <text x="450" y="149" fill="#edf3fc" font-size="24" text-anchor="middle" font-weight="600">+b</text>
    <line x1="321.667" y1="190" x2="434" y2="167" stroke="#ffbd7a" stroke-width="2.5" marker-end="url(#arrow)" />
    <line x1="466" y1="167" x2="578.333" y2="190" stroke="#ffbd7a" stroke-width="2.5" marker-end="url(#arrow)" />
    <rect x="682.667" y="120" width="48" height="44" rx="6" fill="#131d2e" stroke="#89b4ff" stroke-width="1.5" />
    <text x="706.667" y="149" fill="#edf3fc" font-size="24" text-anchor="middle" font-weight="600">φ</text>
    <line x1="578.333" y1="190" x2="690.667" y2="167" stroke="#ffbd7a" stroke-width="2.5" marker-end="url(#arrow)" />
    <line x1="722.667" y1="167" x2="835" y2="190" stroke="#65dfc0" stroke-width="2.5" marker-end="url(#arrow)" />
    <text x="65" y="216" fill="#89b4ff" font-size="24" text-anchor="middle" font-weight="400">x</text>
    <text x="321.667" y="216" fill="#ffbd7a" font-size="24" text-anchor="middle" font-weight="400">z₁</text>
    <text x="578.333" y="216" fill="#ffbd7a" font-size="24" text-anchor="middle" font-weight="400">z₂</text>
    <text x="835" y="216" fill="#65dfc0" font-size="24" text-anchor="middle" font-weight="400">y</text>
    <text x="450" y="249" fill="#b5c4d9" font-size="21" text-anchor="middle" font-weight="400">Global memory</text>
    <text x="32" y="270" fill="#edf3fc" font-size="24" text-anchor="start" font-weight="600">1 fused kernel</text>
    <text x="868" y="270" fill="#65dfc0" font-size="24" text-anchor="end" font-weight="600">8N B</text>
    <rect x="166.333" y="295" width="567.333" height="57" rx="8" fill="#1c2a40" stroke="#65dfc0" stroke-width="1.5" />
    <rect x="53" y="373" width="794" height="36" rx="4" fill="#1c2a40" stroke="none" stroke-width="1.5" />
    <rect x="169.333" y="301" width="48" height="44" rx="6" fill="#131d2e" stroke="#65dfc0" stroke-width="1.5" />
    <text x="193.333" y="330" fill="#edf3fc" font-size="24" text-anchor="middle" font-weight="600">×a</text>
    <line x1="65" y1="371" x2="177.333" y2="348" stroke="#89b4ff" stroke-width="2.5" marker-end="url(#arrow)" />
    <line x1="221.333" y1="323" x2="419" y2="323" stroke="#65dfc0" stroke-width="2.5" marker-end="url(#arrow)" />
    <rect x="426" y="301" width="48" height="44" rx="6" fill="#131d2e" stroke="#65dfc0" stroke-width="1.5" />
    <text x="450" y="330" fill="#edf3fc" font-size="24" text-anchor="middle" font-weight="600">+b</text>
    <line x1="478" y1="323" x2="675.667" y2="323" stroke="#65dfc0" stroke-width="2.5" marker-end="url(#arrow)" />
    <rect x="682.667" y="301" width="48" height="44" rx="6" fill="#131d2e" stroke="#65dfc0" stroke-width="1.5" />
    <text x="706.667" y="330" fill="#edf3fc" font-size="24" text-anchor="middle" font-weight="600">φ</text>
    <line x1="722.667" y1="348" x2="835" y2="371" stroke="#65dfc0" stroke-width="2.5" marker-end="url(#arrow)" />
    <text x="65" y="397" fill="#89b4ff" font-size="24" text-anchor="middle" font-weight="400">x</text>
    <text x="835" y="397" fill="#65dfc0" font-size="24" text-anchor="middle" font-weight="400">y</text>
    <text x="450" y="430" fill="#b5c4d9" font-size="21" text-anchor="middle" font-weight="400">Global memory</text>
    <text x="878" y="462" fill="#b5c4d9" font-size="21" text-anchor="end" font-weight="400">FP32 · N elements · ideal traffic</text>
  </g>
</svg>
