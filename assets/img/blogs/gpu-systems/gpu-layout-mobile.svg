    <text x="119" y="356" fill="#edf3fc" font-size="17" text-anchor="middle" font-weight="400">L1 / shared</text>
    <line x1="119" y1="395" x2="119" y2="431" stroke="#65dfc0" stroke-width="2.5" />
    <rect x="203" y="188" width="136" height="207" rx="8" fill="#1c2a40" stroke="#65dfc0" stroke-width="1.5" />
    <text x="271" y="217" fill="#65dfc0" font-size="18" text-anchor="middle" font-weight="600">SM 1</text>
    <rect x="212" y="233" width="118" height="39" rx="4" fill="#131d2e" stroke="none" stroke-width="1.5" />
