<svg xmlns="http://www.w3.org/2000/svg" width="390" height="626" viewBox="0 0 390 626" role="img" aria-labelledby="title desc">
  <title id="title">Inside a GPU</title>
  <desc id="desc">
    Logical GPU package schematic: HBM stacks sit outside the GPU die. The die contains streaming multiprocessors and shared L2 cache. Each SM
    contains registers, compute units, and L1 cache/shared memory.
  </desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="context-stroke" />
    </marker>
  </defs>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="0" y="0" width="390" height="626" rx="14" fill="#131d2e" stroke="none" stroke-width="1.5" />
    <text x="22" y="36" fill="#edf3fc" font-size="21" text-anchor="start" font-weight="600">Inside a GPU</text>
    <text x="22" y="63" fill="#b5c4d9" font-size="17" text-anchor="start" font-weight="400">Logical layout · not to scale</text>
    <rect x="16" y="85" width="358" height="520" rx="14" fill="#1c2a40" stroke="#3e506a" stroke-width="1.5" />
    <text x="31" y="113" fill="#b5c4d9" font-size="17" text-anchor="start" font-weight="400">GPU package</text>
    <rect x="35" y="138" width="320" height="360" rx="12" fill="#131d2e" stroke="#89b4ff" stroke-width="2" />
    <text x="51" y="167" fill="#89b4ff" font-size="18" text-anchor="start" font-weight="600">GPU die</text>
    <line x1="119.5" y1="539" x2="119.5" y2="498" stroke="#ffbd7a" stroke-width="3" />
    <rect x="67" y="531" width="105" height="44" rx="4" fill="#131d2e" stroke="#ffbd7a" stroke-width="1.5" />
    <rect x="67" y="535" width="105" height="44" rx="4" fill="#131d2e" stroke="#ffbd7a" stroke-width="1.5" />
    <rect x="67" y="539" width="105" height="44" rx="4" fill="#131d2e" stroke="#ffbd7a" stroke-width="1.5" />
    <text x="119.5" y="568" fill="#ffbd7a" font-size="18" text-anchor="middle" font-weight="600">HBM</text>
    <line x1="270.5" y1="539" x2="270.5" y2="498" stroke="#ffbd7a" stroke-width="3" />
    <rect x="218" y="531" width="105" height="44" rx="4" fill="#131d2e" stroke="#ffbd7a" stroke-width="1.5" />
