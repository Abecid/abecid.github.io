    <rect x="51" y="431" width="288" height="45" rx="5" fill="#89b4ff" stroke="none" stroke-width="1.5" />
    <text x="195" y="460.5" fill="#131d2e" font-size="18" text-anchor="middle" font-weight="600">L2 · shared across SMs</text>
  </g>
</svg>
