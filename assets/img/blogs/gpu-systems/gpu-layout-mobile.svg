    <rect x="218" y="539" width="105" height="44" rx="4" fill="#131d2e" stroke="#ffbd7a" stroke-width="1.5" />
    <text x="270.5" y="568" fill="#ffbd7a" font-size="18" text-anchor="middle" font-weight="600">HBM</text>
    <rect x="51" y="188" width="136" height="207" rx="8" fill="#1c2a40" stroke="#65dfc0" stroke-width="1.5" />
    <text x="119" y="217" fill="#65dfc0" font-size="18" text-anchor="middle" font-weight="600">SM 0</text>
    <rect x="60" y="233" width="118" height="39" rx="4" fill="#131d2e" stroke="none" stroke-width="1.5" />
    <text x="119" y="258" fill="#edf3fc" font-size="17" text-anchor="middle" font-weight="400">Registers</text>
