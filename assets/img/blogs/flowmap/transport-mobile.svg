<?xml version="1.0" ?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 420" width="400" height="420" role="img" aria-labelledby="title desc">
  <title id="title">Velocity versus flow map</title>
  <desc id="desc">
    Orange extrapolates the initial tangent and misses the endpoint of the blue curved ODE path. The teal chord is the flow map displacement.
  </desc>
  <defs>
    <marker id="65dfc0" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#65dfc0" stroke-width="2" />
    </marker>
    <marker id="ffbd7a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#ffbd7a" stroke-width="2" />
    </marker>
    <marker id="89b4ff" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#89b4ff" stroke-width="2" />
    </marker>
    <marker id="aab9cf" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#aab9cf" stroke-width="2" />
    </marker>
  </defs>
  <rect width="400" height="420" rx="16" fill="#131d2e" />
  <g font-family="Arial, Helvetica, sans-serif" stroke-linecap="round" stroke-linejoin="round">
    <text x="24" y="38" fill="#e8edf6" font-size="20" text-anchor="start" font-weight="700">Local direction ≠ destination</text>
    <path d="M55,130 C211.60000000000002,130 200.0,275 345,275" stroke="#89b4ff" stroke-width="4" fill="none" />
    <path d="M55,130 L345,130" stroke="#ffbd7a" stroke-width="3" fill="none" stroke-dasharray="9 8" marker-end="url(#ffbd7a)" />
    <path d="M55,138 L339,272" stroke="#65dfc0" stroke-width="4" fill="none" marker-end="url(#65dfc0)" />
    <circle cx="55" cy="130" r="8" fill="#e8edf6" stroke="#e8edf6" stroke-width="2" />
    <circle cx="345" cy="275" r="8" fill="#65dfc0" stroke="#65dfc0" stroke-width="2" />
    <circle cx="345" cy="130" r="8" fill="#131d2e" stroke="#ffbd7a" stroke-width="2" />
    <text x="55" y="105" fill="#e8edf6" font-size="20" text-anchor="start" font-weight="400">Start</text>
    <text x="345" y="105" fill="#ffbd7a" font-size="20" text-anchor="end" font-weight="400">Euler misses</text>
    <text x="345" y="312" fill="#65dfc0" font-size="20" text-anchor="end" font-weight="400">Destination</text>
    <text x="80" y="340" fill="#65dfc0" font-size="18" text-anchor="start" font-weight="400">Map: start → destination</text>
    <text x="100" y="263" fill="#89b4ff" font-size="20" text-anchor="middle" font-weight="400">ODE path</text>
  </g>
</svg>
