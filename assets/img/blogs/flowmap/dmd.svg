  <title id="title">Distribution matching direction</title>
  <desc id="desc">
    At a fixed noise level, the target is N(-1,1) and the student is N(1,1). Their score difference sp minus sq is minus two, moving generated samples
    left toward the target. This is a toy distribution, not an empirical result.
  </desc>
