<?xml version="1.0" ?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-labelledby="title desc">
  <title id="title">Velocity versus flow map</title>
  <desc id="desc">
    Orange extrapolates the initial tangent and misses the endpoint of the blue curved ODE path. The teal chord is the flow map displacement.
  </desc>
  <defs>
    <marker id="65dfc0" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#65dfc0" stroke-width="2" />
    </marker>
    <marker id="ffbd7a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#ffbd7a" stroke-width="2" />
    </marker>
    <marker id="89b4ff" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#89b4ff" stroke-width="2" />
    </marker>
    <marker id="aab9cf" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#aab9cf" stroke-width="2" />
    </marker>
  </defs>
  <rect width="960" height="440" rx="16" fill="#131d2e" />
  <g font-family="Arial, Helvetica, sans-serif" stroke-linecap="round" stroke-linejoin="round">
    <text x="40" y="42" fill="#e8edf6" font-size="24" text-anchor="start" font-weight="700">A tangent cannot predict the whole turn.</text>
    <path d="M140,155 C507.20000000000005,155 480.0,330 820,330" stroke="#89b4ff" stroke-width="4" fill="none" />
    <path d="M140,155 L820,155" stroke="#ffbd7a" stroke-width="3" fill="none" stroke-dasharray="9 8" marker-end="url(#ffbd7a)" />
    <path d="M140,163 L814,327" stroke="#65dfc0" stroke-width="4" fill="none" marker-end="url(#65dfc0)" />
    <circle cx="140" cy="155" r="8" fill="#e8edf6" stroke="#e8edf6" stroke-width="2" />
    <circle cx="820" cy="330" r="8" fill="#65dfc0" stroke="#65dfc0" stroke-width="2" />
    <circle cx="820" cy="155" r="8" fill="#131d2e" stroke="#ffbd7a" stroke-width="2" />
    <text x="140" y="130" fill="#e8edf6" font-size="24" text-anchor="start" font-weight="400">Start</text>
    <text x="820" y="130" fill="#ffbd7a" font-size="24" text-anchor="end" font-weight="400">Euler misses</text>
    <text x="820" y="367" fill="#65dfc0" font-size="24" text-anchor="end" font-weight="400">Destination</text>
    <text x="165" y="392" fill="#65dfc0" font-size="24" text-anchor="start" font-weight="400">Map: start → destination</text>
    <text x="185" y="318" fill="#89b4ff" font-size="24" text-anchor="middle" font-weight="400">ODE path</text>
  </g>
</svg>
