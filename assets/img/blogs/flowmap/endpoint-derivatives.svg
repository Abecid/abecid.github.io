<?xml version="1.0" ?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 365" width="960" height="365" role="img" aria-labelledby="title desc">
  <title id="title">Two ways to constrain a jump</title>
  <desc id="desc">
    MeanFlow varies the starting state and start time along an ODE path while holding destination time fixed. TVM holds the input fixed and varies the
    destination time. A ring marks the fixed endpoint.
  </desc>
  <defs>
    <marker id="65dfc0" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#65dfc0" stroke-width="2" />
    </marker>
    <marker id="ffbd7a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#ffbd7a" stroke-width="2" />
    </marker>
    <marker id="89b4ff" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#89b4ff" stroke-width="2" />
    </marker>
    <marker id="aab9cf" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#aab9cf" stroke-width="2" />
    </marker>
  </defs>
  <rect width="960" height="365" rx="16" fill="#131d2e" />
  <g font-family="Arial, Helvetica, sans-serif" stroke-linecap="round" stroke-linejoin="round">
    <text x="60" y="56" fill="#e8edf6" font-size="24" text-anchor="start" font-weight="700">MeanFlow</text>
    <text x="60" y="88" fill="#ffbd7a" font-size="24" text-anchor="start" font-weight="400">Move the start</text>
    <path d="M60,176 C217.5,101 287.5,261 410,201" stroke="#89b4ff" stroke-width="3" fill="none" />
    <path d="M65,181 L403,202" stroke="#65dfc0" stroke-width="3" fill="none" marker-end="url(#65dfc0)" />
    <circle cx="60" cy="176" r="6" fill="#e8edf6" stroke="#e8edf6" stroke-width="2" />
    <circle cx="410" cy="201" r="6" fill="#e8edf6" stroke="#e8edf6" stroke-width="2" />
    <circle cx="410" cy="201" r="13" fill="#131d2e" stroke="#e8edf6" stroke-width="2" />
    <circle cx="410" cy="201" r="5" fill="#e8edf6" stroke="#e8edf6" stroke-width="2" />
    <circle cx="118" cy="161" r="6" fill="#ffbd7a" stroke="#ffbd7a" stroke-width="2" />
    <path d="M65,172 L112,159" stroke="#ffbd7a" stroke-width="3" fill="none" marker-end="url(#ffbd7a)" />
    <path d="M122,166 L397,197" stroke="#65dfc0" stroke-width="2" fill="none" stroke-dasharray="5 5" marker-end="url(#65dfc0)" />
    <text x="410" y="241" fill="#e8edf6" font-size="24" text-anchor="end" font-weight="400">fixed r</text>
    <text x="60" y="234" fill="#ffbd7a" font-size="24" text-anchor="start" font-weight="400">t changes</text>
    <text x="540" y="56" fill="#e8edf6" font-size="24" text-anchor="start" font-weight="700">TVM</text>
    <text x="540" y="88" fill="#ffbd7a" font-size="24" text-anchor="start" font-weight="400">Move the destination</text>
    <path d="M540,176 C697.5,101 767.5,261 890,201" stroke="#89b4ff" stroke-width="3" fill="none" />
    <path d="M545,181 L883,202" stroke="#65dfc0" stroke-width="3" fill="none" marker-end="url(#65dfc0)" />
    <circle cx="540" cy="176" r="6" fill="#e8edf6" stroke="#e8edf6" stroke-width="2" />
    <circle cx="890" cy="201" r="6" fill="#e8edf6" stroke="#e8edf6" stroke-width="2" />
    <circle cx="540" cy="176" r="13" fill="#131d2e" stroke="#e8edf6" stroke-width="2" />
    <circle cx="540" cy="176" r="5" fill="#e8edf6" stroke="#e8edf6" stroke-width="2" />
    <circle cx="838" cy="217" r="6" fill="#ffbd7a" stroke="#ffbd7a" stroke-width="2" />
    <path d="M884,206 L846,218" stroke="#ffbd7a" stroke-width="3" fill="none" marker-end="url(#ffbd7a)" />
    <path d="M553,173 L833,212" stroke="#65dfc0" stroke-width="2" fill="none" stroke-dasharray="5 5" marker-end="url(#65dfc0)" />
    <text x="540" y="234" fill="#e8edf6" font-size="24" text-anchor="start" font-weight="400">fixed (x, t)</text>
    <text x="890" y="268" fill="#ffbd7a" font-size="24" text-anchor="end" font-weight="400">s changes</text>
    <text x="480.0" y="345" fill="#aab9cf" font-size="24" text-anchor="middle" font-weight="400">○ = held fixed</text>
  </g>
</svg>
