<?xml version="1.0" ?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 670" width="400" height="670" role="img" aria-labelledby="title desc">
  <title id="title">Two ways to constrain a jump</title>
  <desc id="desc">
    MeanFlow varies the starting state and start time along an ODE path while holding destination time fixed. TVM holds the input fixed and varies the
    destination time. A ring marks the fixed endpoint.
  </desc>
  <defs>
    <marker id="65dfc0" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#65dfc0" stroke-width="2" />
    </marker>
    <marker id="ffbd7a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#ffbd7a" stroke-width="2" />
    </marker>
    <marker id="89b4ff" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#89b4ff" stroke-width="2" />
    </marker>
    <marker id="aab9cf" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#aab9cf" stroke-width="2" />
    </marker>
  </defs>
  <rect width="400" height="670" rx="16" fill="#131d2e" />
  <g font-family="Arial, Helvetica, sans-serif" stroke-linecap="round" stroke-linejoin="round">
    <text x="38" y="42" fill="#e8edf6" font-size="20" text-anchor="start" font-weight="700">MeanFlow</text>
    <text x="38" y="74" fill="#ffbd7a" font-size="20" text-anchor="start" font-weight="400">Move the start</text>
    <path d="M38,162 C182.0,87 246.0,247 358,187" stroke="#89b4ff" stroke-width="3" fill="none" />
    <path d="M43,167 L351,188" stroke="#65dfc0" stroke-width="3" fill="none" marker-end="url(#65dfc0)" />
    <circle cx="38" cy="162" r="6" fill="#e8edf6" stroke="#e8edf6" stroke-width="2" />
    <circle cx="358" cy="187" r="6" fill="#e8edf6" stroke="#e8edf6" stroke-width="2" />
    <circle cx="358" cy="187" r="13" fill="#131d2e" stroke="#e8edf6" stroke-width="2" />
    <circle cx="358" cy="187" r="5" fill="#e8edf6" stroke="#e8edf6" stroke-width="2" />
    <circle cx="96" cy="147" r="6" fill="#ffbd7a" stroke="#ffbd7a" stroke-width="2" />
    <path d="M43,158 L90,145" stroke="#ffbd7a" stroke-width="3" fill="none" marker-end="url(#ffbd7a)" />
    <path d="M100,152 L345,183" stroke="#65dfc0" stroke-width="2" fill="none" stroke-dasharray="5 5" marker-end="url(#65dfc0)" />
    <text x="358" y="227" fill="#e8edf6" font-size="20" text-anchor="end" font-weight="400">fixed r</text>
    <text x="38" y="220" fill="#ffbd7a" font-size="20" text-anchor="start" font-weight="400">t changes</text>
    <text x="38" y="357" fill="#e8edf6" font-size="20" text-anchor="start" font-weight="700">TVM</text>
    <text x="38" y="389" fill="#ffbd7a" font-size="20" text-anchor="start" font-weight="400">Move the destination</text>
    <path d="M38,477 C182.0,402 246.0,562 358,502" stroke="#89b4ff" stroke-width="3" fill="none" />
    <path d="M43,482 L351,503" stroke="#65dfc0" stroke-width="3" fill="none" marker-end="url(#65dfc0)" />
    <circle cx="38" cy="477" r="6" fill="#e8edf6" stroke="#e8edf6" stroke-width="2" />
    <circle cx="358" cy="502" r="6" fill="#e8edf6" stroke="#e8edf6" stroke-width="2" />
    <circle cx="38" cy="477" r="13" fill="#131d2e" stroke="#e8edf6" stroke-width="2" />
    <circle cx="38" cy="477" r="5" fill="#e8edf6" stroke="#e8edf6" stroke-width="2" />
    <circle cx="306" cy="518" r="6" fill="#ffbd7a" stroke="#ffbd7a" stroke-width="2" />
    <path d="M352,507 L314,519" stroke="#ffbd7a" stroke-width="3" fill="none" marker-end="url(#ffbd7a)" />
    <path d="M51,474 L301,513" stroke="#65dfc0" stroke-width="2" fill="none" stroke-dasharray="5 5" marker-end="url(#65dfc0)" />
    <text x="38" y="535" fill="#e8edf6" font-size="20" text-anchor="start" font-weight="400">fixed (x, t)</text>
